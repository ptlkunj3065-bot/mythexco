<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(async function () {
  var feed = document.getElementById('feed');

  feed.innerHTML = '<p class="empty">Loading products...</p>';

  try {
    var result = await window.supabaseClient
      .from('products')
      .select('id, date, image_url, affiliate_link')
      .order('date', { ascending: false })
      .order('created_at', { ascending: false });

    if (result.error) throw result.error;

    var items = result.data || [];
    feed.innerHTML = '';

    if (!items.length) {
      feed.innerHTML =
        '<p class="empty">Fresh finds are coming soon.</p>';
      return;
    }

    var groups = {};
    var order = [];

    items.forEach(function (p) {
      if (!groups[p.date]) {
        groups[p.date] = [];
        order.push(p.date);
      }
      groups[p.date].push(p);
    });

    var today = new Date().toLocaleDateString('en-CA');

    function label(d) {
      if (d === today) return 'Today';

      return new Date(d + 'T00:00:00')
        .toLocaleDateString('en-IN', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
    }

    order.forEach(function (d) {
      var sec = document.createElement('section');
      sec.className = 'day';

      var h = document.createElement('h2');
      h.textContent = label(d);
      sec.appendChild(h);

      var grid = document.createElement('div');
      grid.className = 'grid';

      groups[d].forEach(function (p, i) {
        var a = document.createElement('a');
        a.className = 'item';
        a.href = p.affiliate_link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer sponsored';
        a.setAttribute(
          'aria-label',
          'Open product ' + (i + 1) + ' from ' + label(d)
        );

        var img = document.createElement('img');
        img.src = p.image_url;
        img.alt = '';
        img.loading = 'lazy';

        a.appendChild(img);
        grid.appendChild(a);
      });

      sec.appendChild(grid);
      feed.appendChild(sec);
    });

  } catch (error) {
    console.error('Supabase product loading error:', error);
    feed.innerHTML =
      '<p class="empty">Products could not load. Please try again later.</p>';
  }
})();
</script>

<script>
(function(){
  var feed=document.getElementById('feed');
  var items=(window.PRODUCTS||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  if(!items.length){feed.innerHTML='<p class="empty">Fresh finds are coming soon.</p>';return}
  var groups={},order=[];
  items.forEach(function(p){ if(!groups[p.date]){groups[p.date]=[];order.push(p.date)} groups[p.date].push(p) });
  var today=new Date().toISOString().slice(0,10);
  function label(d){
    if(d===today) return 'Today';
    var dt=new Date(d+'T00:00:00');
    return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
  }
  order.forEach(function(d){
    var sec=document.createElement('section'); sec.className='day';
    var h=document.createElement('h2'); h.textContent=label(d); sec.appendChild(h);
    var g=document.createElement('div'); g.className='grid';
    groups[d].forEach(function(p,i){
      var a=document.createElement('a'); a.className='item';
      a.href=p.link; a.target='_blank'; a.rel='noopener noreferrer sponsored';
      a.setAttribute('aria-label','Open product '+(i+1)+' from '+label(d));
      var img=document.createElement('img'); img.src=p.image; img.alt=''; img.loading='lazy';
      a.appendChild(img); g.appendChild(a);
    });
    sec.appendChild(g); feed.appendChild(sec);
  });
})();
</script>
